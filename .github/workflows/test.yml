name: Test

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Go unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The vaultfs mount tests skip when FUSE is unusable, so without this
      # the go-fuse binding would silently go untested in CI while every
      # other package stayed green. Installing the helper makes the skip a
      # real signal rather than the permanent state.
      - name: Install FUSE (for the filesystem mount tests)
        run: sudo apt-get update && sudo apt-get install -y fuse3

      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: CGO_ENABLED=0 go build -o dotvault ./cmd/dotvault

      - name: Verify binary runs
        run: ./dotvault version

      - name: Verify packaged systemd units
        run: |
          sudo install -m 0755 ./dotvault /usr/bin/dotvault
          systemd-analyze verify \
            packaging/linux/dotvault.service

