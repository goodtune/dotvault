name: Test

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Go unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The vaultfs mount tests skip when FUSE is unusable, so without this
      # the go-fuse binding would silently go untested in CI while every
      # other package stayed green. Installing the helper makes the skip a
      # real signal rather than the permanent state.
      - name: Install FUSE (for the filesystem mount tests)
        run: sudo apt-get update && sudo apt-get install -y fuse3

      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: CGO_ENABLED=0 go build -o dotvault ./cmd/dotvault

      - name: Verify binary runs
        run: ./dotvault version

      - name: Verify packaged systemd units
        run: |
          sudo install -m 0755 ./dotvault /usr/bin/dotvault
          systemd-analyze verify \
            packaging/linux/dotvault.service
          # The unit must carry no seccomp-based sandboxing. systemd implies
          # NoNewPrivileges=yes for any of these in a user-manager unit, and
          # that disarms the setuid FUSE mount helper, silently breaking
          # fuse.enabled. See the comment in the unit itself.
          if grep -nE '^[[:space:]]*(NoNewPrivileges|RestrictNamespaces|RestrictSUIDSGID|LockPersonality|RestrictRealtime|MemoryDenyWriteExecute|SystemCallFilter|SystemCallArchitectures|ProtectClock|ProtectKernelTunables|ProtectKernelModules|ProtectKernelLogs|PrivateDevices)[[:space:]]*=' \
               packaging/linux/dotvault.service; then
            echo "::error file=packaging/linux/dotvault.service::seccomp-based sandbox directive present; this breaks fuse.enabled (see the comment in the unit)"
            exit 1
          fi
          # The unit ships to installed systems where CLAUDE.md and the docs
          # tree are absent, so it points at the published docs instead. Only
          # docs/ is covered by `mkdocs build --strict`, so without this a
          # heading rename would silently strand that link.
          for anchor in $(grep -oE 'goodtune\.github\.io/dotvault/admin/deployment/#[a-z0-9-]+' \
                            packaging/linux/dotvault.service | sed 's/.*#//' | sort -u); do
            heading=$(grep -oiE '^#+ .*' docs/admin/deployment.md \
                        | sed -E 's/^#+ //; s/[^A-Za-z0-9 -]//g' \
                        | tr '[:upper:] ' '[:lower:]-' | grep -Fx "$anchor" || true)
            if [ -z "$heading" ]; then
              echo "::error file=packaging/linux/dotvault.service::unit links to #$anchor, which is not a heading in docs/admin/deployment.md"
              exit 1
            fi
          done

