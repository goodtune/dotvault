services:
  # Generates the throwaway self-signed certificate the TLS listener needs.
  # Runs to completion before Vault starts, because a listener cannot come up
  # without its cert. The material lives in a volume and is never committed;
  # an existing cert is reused so restarts do not invalidate a running client.
  vault-tls:
    image: alpine/openssl:latest
    container_name: dotvault-vault-tls
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        if [ -s /tls/vault.crt ] && [ -s /tls/vault.key ]; then
          echo "==> Reusing existing dev TLS certificate"
          exit 0
        fi
        echo "==> Generating dev TLS certificate for the Vault cert-auth listener..."
        openssl req -x509 -newkey rsa:2048 -nodes \
          -keyout /tls/vault.key -out /tls/vault.crt -days 3650 \
          -subj "/CN=localhost" \
          -addext "subjectAltName=DNS:localhost,DNS:vault,IP:127.0.0.1"
        chmod 644 /tls/vault.crt /tls/vault.key
        echo "==> Dev TLS certificate ready"
    volumes:
      - vault-tls:/tls

  vault:
    image: hashicorp/vault:1.21
    container_name: dotvault-vault
    depends_on:
      vault-tls:
        condition: service_completed_successfully
    ports:
      - "8200:8200"
      - "8300:8300"
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - vault-data:/vault/data
      - vault-tls:/vault/tls:ro
      - ./vault-server.hcl:/vault/config/server.hcl:ro
    command: ["sh", "-c", "chown -R vault:vault /vault/data && su-exec vault vault server -config=/vault/config/server.hcl"]
    healthcheck:
      test: ["CMD", "vault", "status", "-tls-skip-verify"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s

  # NOTE: Add "127.0.0.1 dex" to /etc/hosts for browser-based OIDC flow
  dex:
    image: dexidp/dex:v2.41.1
    container_name: dotvault-dex
    ports:
      - "5556:5556"
    volumes:
      - ./dex.yaml:/etc/dex/config.yaml:ro
      - dex-data:/var/dex
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5556/dex/.well-known/openid-configuration"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s

  vault-init:
    image: hashicorp/vault:1.21
    container_name: dotvault-vault-init
    depends_on:
      vault:
        condition: service_started
      dex:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e

        echo "==> Waiting for Vault to start..."
        until vault status 2>&1 | grep -qE '(Sealed\s+true|Sealed\s+false)'; do
          sleep 1
        done

        # Initialise if needed (single key, threshold 1 for dev use)
        if vault status 2>&1 | grep -q 'Initialized.*false'; then
          echo "==> Initialising Vault..."
          vault operator init -key-shares=1 -key-threshold=1 \
            -format=json > /vault/data/init.json
        fi

        # Extract keys from init output (no jq in vault image)
        UNSEAL_KEY=$$(sed -n '/unseal_keys_b64/{n;s/.*"\(.*\)".*/\1/p;}' /vault/data/init.json)
        ROOT_TOKEN=$$(sed -n 's/.*"root_token": *"\([^"]*\)".*/\1/p' /vault/data/init.json)

        # Unseal if sealed
        if vault status 2>&1 | grep -q 'Sealed.*true'; then
          echo "==> Unsealing Vault..."
          vault operator unseal "$$UNSEAL_KEY"
        fi

        # Authenticate with root token
        export VAULT_TOKEN="$$ROOT_TOKEN"

        echo "==> Enabling KV v2 secrets engine..."
        vault secrets enable -path=kv -version=2 kv 2>/dev/null || true

        echo "==> Writing dotvault policy..."
        vault policy write dotvault - <<'POLICY'
        path "kv/data/users/*" {
          capabilities = ["create", "read", "update", "delete", "list"]
        }
        path "kv/metadata/users/*" {
          capabilities = ["read", "list", "delete"]
        }
        # Read-only access to per-user app secrets so the "copy" enrolment
        # engine can mirror them into the user's enrolment path.
        path "kv/data/apps/+/keys/*" {
          capabilities = ["read"]
        }
        # Token self-management. These matter specifically when
        # no_default_policy is set: stripping the implicit `default` policy also
        # strips these, and dotvault needs all three.
        #
        #   create      — Downscope exchanges the login token for a
        #                 least-privilege child; without it login fails closed.
        #   lookup-self — the lifecycle manager's health check every 5 minutes.
        #                 A 403 here is read as "token invalid", so a policy
        #                 lacking it puts the daemon in a permanent re-auth loop
        #                 despite holding a perfectly good token.
        #   renew-self  — renewal at 75% TTL; without it every token runs to
        #                 expiry and forces an unnecessary re-auth.
        path "auth/token/create" {
          capabilities = ["create", "update"]
        }
        path "auth/token/lookup-self" {
          capabilities = ["read"]
        }
        path "auth/token/renew-self" {
          capabilities = ["update"]
        }
        path "sys/events/subscribe/*" {
          capabilities = ["read"]
        }
        POLICY

        echo "==> Writing sample secrets..."
        vault kv put kv/users/gary/gh token=ghp_example_token_1234
        vault kv put kv/users/gary/netrc \
          play.stirlo.au='{"login":"gary","password":"s3cret"}'
        # Seed a per-user app secret for exercising the "copy" enrolment
        # engine, which mirrors a value from one Vault path to another.
        vault kv put kv/apps/sample/keys/gary key=copied-from-upstream

        echo "==> Enabling OIDC auth method..."
        vault auth enable oidc 2>/dev/null || true

        echo "==> Configuring OIDC auth with Dex..."
        vault write auth/oidc/config \
          oidc_discovery_url="http://dex:5556/dex" \
          oidc_client_id="dotvault" \
          oidc_client_secret="dotvault-dev-secret" \
          default_role="default"

        echo "==> Creating OIDC default role..."
        vault write auth/oidc/role/default \
          bound_audiences="dotvault" \
          allowed_redirect_uris="http://127.0.0.1:9000/auth/oidc/callback" \
          allowed_redirect_uris="http://127.0.0.1:8250/oidc/callback" \
          user_claim="email" \
          oidc_scopes="openid,email" \
          token_policies="dotvault"

        # --- Certificate auth (mtls / mtls+tpm / mtls+os) ---
        #
        # dotvault's cert-auth flow needs two Vault pieces: a PKI engine to sign
        # the client CSR, and a cert auth method that trusts the resulting CA.
        # Provisioning both here is what lets test/integration exercise a REAL
        # mTLS token exchange — CSR to pki/sign, TLS client-cert handshake, then
        # auth/cert/login — instead of a fake HTTP server.
        echo "==> Enabling PKI secrets engine..."
        vault secrets enable -path=pki pki 2>/dev/null || true
        vault secrets tune -max-lease-ttl=87600h pki

        echo "==> Generating PKI root CA..."
        vault write -field=certificate pki/root/generate/internal \
          common_name="dotvault-dev-ca" \
          issuer_name="dotvault-dev" \
          ttl=87600h > /vault/data/pki-ca.crt

        echo "==> Creating PKI role for client certificates..."
        # Client-auth certificates keyed on the OS username. require_cn is off
        # and the CN is unconstrained so a test can request any identity;
        # a production role would bind allowed_domains instead.
        vault write pki/roles/dotvault-client \
          allow_any_name=true \
          allow_bare_domains=true \
          allow_subdomains=true \
          client_flag=true \
          server_flag=false \
          key_type=any \
          max_ttl=720h \
          ttl=720h

        echo "==> Enabling cert auth method..."
        vault auth enable cert 2>/dev/null || true

        echo "==> Registering the PKI CA with cert auth..."
        # The cert role trusts anything signed by our CA and issues tokens
        # carrying the same dotvault policy the OIDC role does, so an
        # integration test can assert the exchanged token actually works.
        vault write auth/cert/certs/dotvault \
          display_name=dotvault \
          policies=dotvault \
          certificate=@/vault/data/pki-ca.crt \
          ttl=3600

        # Broader policy for the bootstrap step: signing a CSR needs pki/sign,
        # which the operational dotvault policy deliberately does not grant.
        echo "==> Writing dotvault-bootstrap policy..."
        vault policy write dotvault-bootstrap - <<'POLICY'
        path "pki/sign/dotvault-client" {
          capabilities = ["create", "update"]
        }
        POLICY

        # Write root token to shared volume for host access
        echo "$$ROOT_TOKEN" > /vault/data/root-token

        echo "==> Vault ready (root token written to /vault/data/root-token)"
        echo "==> Run: docker exec dotvault-vault cat /vault/data/root-token"
    volumes:
      - vault-data:/vault/data

  # Opt-in Artifactory JCR + Postgres for exercising the JFrog enrolment
  # engine. Activated by `docker compose --profile jfrog up -d`. Plain `up`
  # skips both. Artifactory 7.78+ no longer supports the embedded Derby DB,
  # so Postgres is required even for single-node dev use.
  artifactory-db:
    image: postgres:16-alpine
    container_name: dotvault-artifactory-db
    profiles: ["jfrog"]
    environment:
      POSTGRES_USER: artifactory
      POSTGRES_PASSWORD: dotvault-dev
      POSTGRES_DB: artifactory
    volumes:
      - artifactory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artifactory -d artifactory"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  artifactory:
    image: releases-docker.jfrog.io/jfrog/artifactory-jcr:7.98.9
    container_name: dotvault-artifactory
    profiles: ["jfrog"]
    depends_on:
      artifactory-db:
        condition: service_healthy
    # Bind explicitly to loopback so the dev-only admin password + pinned
    # master/join keys aren't reachable from the LAN. The plain "8082:8082"
    # form binds on all interfaces on Docker Desktop.
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      # Dev-only deterministic master/join keys. Artifactory refuses to start
      # without these and its auto-generation on first boot is unreliable on
      # Docker Desktop volumes; pinning them sidesteps that. NOT SECRETS —
      # this stack binds only to loopback and is for enrolment testing.
      JF_SHARED_SECURITY_MASTERKEY: "deadbeefcafebabe0123456789abcdeffedcba98765432100123456789abcdef"
      JF_SHARED_SECURITY_JOINKEY: "cafebabedeadbeef00112233445566778899aabbccddeeff0011223344556677"
      JF_SHARED_DATABASE_TYPE: "postgresql"
      JF_SHARED_DATABASE_DRIVER: "org.postgresql.Driver"
      JF_SHARED_DATABASE_URL: "jdbc:postgresql://artifactory-db:5432/artifactory"
      JF_SHARED_DATABASE_USERNAME: "artifactory"
      JF_SHARED_DATABASE_PASSWORD: "dotvault-dev"
    volumes:
      - artifactory-data:/var/opt/jfrog/artifactory
    mem_limit: 4g
    ulimits:
      nproc: 65535
      nofile:
        soft: 32000
        hard: 40000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/artifactory/api/system/ping >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s

volumes:
  vault-tls:
  vault-data:
  dex-data:
  artifactory-data:
  artifactory-db-data:
