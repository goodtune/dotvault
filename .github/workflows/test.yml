name: Test

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Go unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: CGO_ENABLED=0 go build -o dotvault ./cmd/dotvault

      - name: Verify binary runs
        run: ./dotvault version

      - name: Verify packaged systemd units
        run: |
          sudo install -m 0755 ./dotvault /usr/bin/dotvault
          systemd-analyze verify \
            packaging/linux/dotvault.service

  frontend-bundle:
    name: Frontend bundle freshness
    runs-on: ubuntu-latest
    # Separate job because it needs Node/npm, which unit-tests doesn't set up.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install frontend dependencies
        run: npm ci
        working-directory: internal/web/frontend

      - name: Rebuild bundle
        run: npm run build
        working-directory: internal/web/frontend

      - name: Verify committed bundle is up to date
        run: |
          if ! git diff --exit-code -- internal/web/static/app.js; then
            echo "::error::internal/web/static/app.js is stale relative to internal/web/frontend/src and package-lock.json." >&2
            echo "Run 'cd internal/web/frontend && npm run build', then commit the updated internal/web/static/app.js." >&2
            exit 1
          fi
