# Drop-in for the sshfwd integration test server (docker-compose "sshfwd"
# profile). AllowStreamLocalForwarding is what dotvault's managed forwards
# need. StreamLocalBindUnlink is left at its OpenSSH default ("no") rather
# than being set to "yes": that default is exactly what makes a `bind()`
# against an existing socket path fail EADDRINUSE, which is the condition
# TestForwardReclaimsStaleSocket exists to exercise — dotvault's own
# liveListenerAt/removeRemoteFile reclaim path (forward.go), not sshd doing
# the cleanup for us.
AllowStreamLocalForwarding yes
StreamLocalBindUnlink no
