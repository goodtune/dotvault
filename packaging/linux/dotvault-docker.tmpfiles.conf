# Registers the dotvault Docker volume plugin with a rootless Docker engine,
# per user, at login. Installed as /usr/share/user-tmpfiles.d/dotvault-docker.conf.
#
# WHY A TMPFILES SNIPPET AND NOT A PACKAGED FILE. An engine does not look in
# dotvault's runtime directory on its own; it needs a one-line .spec file
# naming the socket. That file lives under $HOME and its contents embed the
# user's uid (via $XDG_RUNTIME_DIR), so a distro package cannot ship it
# directly. systemd user-tmpfiles is the mechanism built for exactly this:
# %h and %t expand per user when the user manager runs
# `systemd-tmpfiles --user --create` at login.
#
# WHY /usr/share AND NOT /usr/lib. The *system* tmpfiles search path is
# /usr/lib/tmpfiles.d; the *user* one is /usr/share/user-tmpfiles.d. Easy to
# get wrong by analogy. Full precedence, highest first:
#   ~/.config/user-tmpfiles.d, $XDG_RUNTIME_DIR/user-tmpfiles.d,
#   ~/.local/share/user-tmpfiles.d, /usr/local/share/user-tmpfiles.d,
#   /usr/share/user-tmpfiles.d
#
# THE INSTALLED BASENAME IS PART OF THE CONTRACT. It is the user's opt-out
# handle: tmpfiles' own vendor-override convention is a same-named symlink to
# /dev/null in a higher-precedence directory, i.e.
#   ln -s /dev/null ~/.config/user-tmpfiles.d/dotvault-docker.conf
# Renaming this file silently breaks every opt-out already in place.
#
# THIS IS A DELIBERATE SHIFT IN POSTURE, not an oversight. The daemon still
# never writes the spec (see paths.DefaultDockerSocket) — the *distribution*
# does, into a directory another tool owns. Two things keep that honest: the
# `f` line below never clobbers an existing spec, and the opt-out above is a
# one-liner. See docs/guide/docker-volumes.md for the user-facing statement.
#
# `f`, NEVER `f+`. `f` writes the argument only when it creates the file;
# `f+` truncates and rewrites on every login, which would stamp on an
# operator who pointed docker.socket (or dotvault-docker.socket's
# ListenStream=) somewhere else. `f` writes the argument with no trailing
# newline, which is fine: moby TrimSpace's the spec body
# (pkg/plugins/discovery.go, readPluginInfo).
#
# THE MODES ARE `:`-PREFIXED, and that is the other half of not clobbering.
# `f` protects the file's *contents* only. A bare MODE field is enforced on
# every run, so `0644` would chmod a spec an operator had tightened to 0600
# back to 0644 at each login, and `0755` would do the same to a 0700 plugin
# directory. A `:MODE` is applied at creation and never re-applied. Verified
# against systemd 255: without the colon an existing 0700/0600 pair came
# back 0755/0644.
#
# THE PATH MATCHES BOTH BIND MODES. %t/dotvault/docker.sock is
# paths.DefaultDockerSocket and is also dotvault-docker.socket's
# ListenStream=, so this line is correct whether the daemon self-binds or
# inherits the fd from systemd. It is wrong only if the operator customised
# one of those — hence `f`, so their hand-written spec survives.
#
# ~/.local/lib RATHER THAN ~/.config/docker/plugins: moby's
# rootlessConfigPluginsPath has an inverted error check in every release
# through v28, so the documented config-home location resolves to
# /etc/docker/plugins in practice while the lib-home one works.
#
# KNOWN LIMIT: rootlessLibPluginsPath() honours $XDG_LIB_HOME (via
# homedir.GetLibHome), and tmpfiles has no specifier for that variable, so
# %h/.local/lib is a hardcode that is wrong for anyone who sets it. Such a
# user writes the spec by hand, as before.
#
# Alpine is OpenRC, not systemd: the file is shipped there for consistency
# but is simply inert, exactly like the .socket units beside it.
d %h/.local/lib/docker/plugins :0755 - - -
f %h/.local/lib/docker/plugins/dotvault.spec :0644 - - - unix://%t/dotvault/docker.sock
