# Drop-in for the second sshfwd integration test server (docker-compose
# "sshfwd" profile, the "sshd-noforward" service), used only by
# TestVerifyRefusesWhenForwardingDisabled. AllowStreamLocalForwarding no is
# the one thing this server exists to provide — a real sshd's rejection of
# the streamlocal-forward@openssh.com global request, not a model of it.
AllowStreamLocalForwarding no
